<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霹靂神州：天罪自走棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-app">
        <!-- 頂部狀態列 -->
        <header id="top-bar">
            <div class="logo">⚔️ 霹靂神州：天罪自走棋</div>
            <div class="stats">
                <span>💰 金幣: <strong id="gold">10</strong></span>
                <span>⭐ 等級: <strong id="level">1</strong> (<span id="exp">0/4</span>)</span>
                <span>❤️ 血量: <strong id="hp">100</strong></span>
            </div>
        </header>

        <!-- 主主體區 -->
        <main id="main-content">
            <!-- 左側羈絆列表 -->
            <aside id="synergy-box">
                <h3>已激活羈絆</h3>
                <div id="synergies"><div class="empty">尚無羈絆</div></div>
            </aside>

            <!-- 中間遊戲畫布 -->
            <section id="canvas-container">
                <div class="control-row">
                    <span id="stage-info">回合 1-1（準備階段）</span>
                    <button id="btn-battle" onclick="startBattle()">⚔️️ 開始戰鬥</button>
                </div>
                <!-- Canvas 畫布區 -->
                <canvas id="gameCanvas" width="800" height="420"></canvas>
            </section>
        </main>

        <!-- 底部商店 -->
        <footer id="shop-bar">
            <div class="shop-btns">
                <button onclick="refreshShop()">🎲 刷新 (2金)</button>
                <button onclick="buyExp()">⚡ 買經驗 (4金)</button>
            </div>
            <div id="shop-cards"></div>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
