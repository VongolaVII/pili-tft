<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霹靂神州：天罪自走棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 頂部資訊欄 -->
        <header id="top-bar">
            <div class="title">⚔️ 霹靂神州：天罪自走棋</div>
            <div class="stats">
                <span class="stat-item">💰 金幣: <strong id="gold">10</strong></span>
                <span class="stat-item">⭐ 等級: <strong id="level">1</strong> (<span id="exp">0/2</span> EXP)</span>
                <span class="stat-item">❤️ 血量: <strong id="hp">100</strong></span>
            </div>
        </header>

        <!-- 主遊戲區域 -->
        <main id="main-stage">
            <!-- 左側羈絆欄 -->
            <aside id="synergy-sidebar">
                <h3>已激活羈絆</h3>
                <div id="synergy-list">
                    <div class="synergy-empty">尚無 active 羈絆</div>
                </div>
            </aside>

            <!-- 中間棋盤與控制區 -->
            <section id="board-container">
                <div class="stage-header">
                    <span id="stage-title">回合 1-1（準備階段）</span>
                    <button id="btn-start-battle" onclick="startBattle()">⚔️ 開始戰鬥</button>
                </div>

                <!-- 六角形棋盤戰場 (4行 7列) -->
                <div id="hex-board"></div>

                <!-- 備戰區 (9格) -->
                <div class="bench-section">
                    <div class="section-title">備戰區</div>
                    <div id="bench"></div>
                </div>
            </section>
        </main>

        <!-- 底部商店與控制區 -->
        <footer id="shop-container">
            <div class="shop-controls">
                <button class="shop-btn" onclick="refreshShop()">🎲 刷新商店 (2金)</button>
                <button class="shop-btn" onclick="buyExp()">⚡ 購買經驗 (4金)</button>
            </div>
            <div id="shop"></div>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
